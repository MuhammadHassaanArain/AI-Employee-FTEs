## Rule Conflict Resolution

When multiple rules match a task:

1. **Priority Order**: Critical > High > Medium > Low
2. **Action Precedence**: block > require_approval > warn > flag
3. **Apply Most Restrictive**: If conflicts occur, use the most restrictive action
4. **Log All Matches**: Record all matched rules in plan's `handbook_rules_applied` field

Example:
```
Task contains: "urgent payment of $100"

Matched rules:
- "Always flag urgent emails" (High, flag)
- "Human approval required for payments >$50" (Critical, require_approval)

Resolution:
- Apply require_approval (more restrictive than flag)
- Log both rules in handbook_rules_applied
- Add approval checkpoint in plan
```

## Implementation Notes

- Parse handbook on system startup and cache in memory
- Reload handbook when file modification detected (hot reload)
- Validate handbook structure on load, log errors if invalid
- Provide clear error messages for malformed rules
- Support comments in handbook (lines starting with `<!--`)
- Case-insensitive keyword matching
- Partial word matching (e.g., "pay" matches "payment")
