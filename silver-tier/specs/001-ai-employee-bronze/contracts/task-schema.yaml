## Example: Task with Error

```markdown
---
id: "f1e2d3c4-b5a6-4987-a654-321098765fed"
title: "Unknown File Type"
source_path: "/Users/john/monitored/data.bin"
created_at: "2026-02-15T15:10:00Z"
status: "error"
original_filename: "data.bin"
file_size: 1048576
detected_at: "2026-02-15T15:10:05Z"
error_message: "Failed to parse file content: Binary file not supported"
---

# Unknown File Type

[Unable to extract content from binary file]

## Error Details
- **Error**: Failed to parse file content: Binary file not supported
- **Recommendation**: Convert to text format or manually process

## Metadata
- **Source**: /Users/john/monitored/data.bin
- **Detected**: 2026-02-15 15:10:05 UTC
- **Size**: 1.0 MB
- **Status**: Error
```

## Implementation Notes

- Use `python-frontmatter` library for parsing and generation
- Validate all required fields before writing file
- Generate UUID v4 using Python's `uuid.uuid4()`
- Use `datetime.utcnow().isoformat() + 'Z'` for timestamps
- Sanitize title to remove special characters that break filenames
- Handle file encoding errors gracefully (default to UTF-8)
